<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIEO 2026 課前自我評量</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e1a;
    --card: #131929;
    --card-hover: #1a2236;
    --border: #1e2a42;
    --accent: #00e5ff;
    --accent-dim: rgba(0,229,255,0.12);
    --correct: #00e676;
    --correct-dim: rgba(0,230,118,0.12);
    --wrong: #ff5252;
    --wrong-dim: rgba(255,82,82,0.12);
    --unsure: #ffc107;
    --unsure-dim: rgba(255,193,7,0.12);
    --text: #e8eaf6;
    --text-dim: #7986a8;
    --radius: 14px;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
  }

  .hero {
    text-align: center;
    padding: 60px 24px 40px;
    background: linear-gradient(180deg, #0f1528 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
  }
  .hero-badge {
    display: inline-block;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding: 5px 16px;
    border-radius: 99px;
    letter-spacing: 1px;
    margin-bottom: 18px;
  }
  .hero h1 {
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 900;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    color: var(--text-dim);
    font-size: 15px;
    max-width: 560px;
    margin: 0 auto 28px;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 13px;
    font-weight: 500;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-dot.c { background: var(--correct); }
  .legend-dot.u { background: var(--unsure); }
  .legend-dot.w { background: var(--wrong); }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 28px 24px;
    margin-bottom: 20px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .q-card:hover { border-color: #2a3a5a; }
  .q-card.answered-correct { border-color: var(--correct); box-shadow: 0 0 20px rgba(0,230,118,0.08); }
  .q-card.answered-wrong { border-color: var(--wrong); box-shadow: 0 0 20px rgba(255,82,82,0.08); }
  .q-card.answered-unsure { border-color: var(--unsure); box-shadow: 0 0 20px rgba(255,193,7,0.08); }

  .q-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .q-num {
    flex-shrink: 0;
    width: 34px; height: 34px;
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 900;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
  }
  .q-tag {
    font-size: 12px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.04);
    padding: 3px 10px;
    border-radius: 6px;
    font-weight: 500;
  }
  .q-text {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.75;
    margin-bottom: 20px;
  }

  .q-options { display: flex; gap: 10px; flex-wrap: wrap; }
  .q-btn {
    flex: 1;
    min-width: 120px;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .q-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-dim); }
  .q-btn:disabled { cursor: default; opacity: 0.5; }
  .q-btn.selected-correct { border-color: var(--correct); background: var(--correct-dim); color: var(--correct); opacity: 1 !important; }
  .q-btn.selected-wrong { border-color: var(--wrong); background: var(--wrong-dim); color: var(--wrong); opacity: 1 !important; }
  .q-btn.selected-unsure { border-color: var(--unsure); background: var(--unsure-dim); color: var(--unsure); opacity: 1 !important; }
  .q-btn.show-answer { border-color: var(--correct); background: var(--correct-dim); color: var(--correct); opacity: 1 !important; }

  .q-explain {
    margin-top: 16px;
    padding: 16px 18px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.8;
    display: none;
  }
  .q-explain.visible { display: block; }
  .q-explain.is-correct { background: var(--correct-dim); border-left: 3px solid var(--correct); }
  .q-explain.is-wrong { background: var(--wrong-dim); border-left: 3px solid var(--wrong); }
  .q-explain.is-unsure { background: var(--unsure-dim); border-left: 3px solid var(--unsure); }
  .q-explain .pts { font-weight: 700; margin-bottom: 6px; }
  .q-explain .pts.c { color: var(--correct); }
  .q-explain .pts.u { color: var(--unsure); }
  .q-explain .pts.w { color: var(--wrong); }

  .progress-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,14,26,0.92);
    backdrop-filter: blur(10px);
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .progress-inner {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #76ff03); border-radius: 99px; transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }
  .progress-label { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }

  .result-panel {
    display: none;
    text-align: center;
    padding: 48px 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-top: 12px;
  }
  .result-panel.visible { display: block; }
  .result-score {
    font-size: clamp(56px, 10vw, 80px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), #76ff03);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .result-label { font-size: 16px; color: var(--text-dim); margin-bottom: 24px; }
  .result-breakdown { display: flex; justify-content: center; gap: 28px; margin-bottom: 32px; flex-wrap: wrap; }
  .result-stat { text-align: center; }
  .result-stat .num { font-size: 28px; font-weight: 900; }
  .result-stat .num.c { color: var(--correct); }
  .result-stat .num.u { color: var(--unsure); }
  .result-stat .num.w { color: var(--wrong); }
  .result-stat .lbl { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .result-message { font-size: 15px; line-height: 1.8; color: var(--text-dim); max-width: 500px; margin: 0 auto 28px; }

  .btn-restart {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    background: var(--accent);
    color: #000;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin: 0 8px;
  }
  .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,229,255,0.25); }

  .pool-info {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 8px;
  }

  .footer { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }

  .reshuffle-bar {
    max-width: 780px;
    margin: 0 auto;
    padding: 14px 20px 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
  }
  .reshuffle-bar .pool-hint {
    font-size: 12px;
    color: var(--text-dim);
  }
  .btn-reshuffle {
    padding: 9px 20px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reshuffle:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  @media (max-width: 520px) {
    .q-card { padding: 20px 18px 18px; }
    .q-options { flex-direction: column; }
    .q-btn { min-width: unset; }
    .hero { padding: 40px 18px 28px; }
    .btn-restart { margin: 6px 4px; padding: 12px 22px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">AIEO 2026</div>
  <h1><span>AI 搜尋時代</span>課前自我評量</h1>
  <p>從 30 題題庫中隨機抽出 10 道是非題，測試您對 AI 搜尋優化的理解程度。<br>
  課程結束後，每一題您都將完全掌握。</p>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot c"></div>答對 +10 分</div>
    <div class="legend-item"><div class="legend-dot u"></div>不確定 +5 分</div>
    <div class="legend-item"><div class="legend-dot w"></div>答錯 0 分</div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-inner">
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    <div class="progress-label" id="progLabel">0 / 10</div>
  </div>
</div>

<div class="reshuffle-bar">
  <span class="pool-hint">題庫 30 題，隨機抽 10 題</span>
  <button class="btn-reshuffle" onclick="restart()">&#x1F3B2; 重新抽題</button>
</div>

<div class="container" id="qContainer"></div>

<div class="container" style="padding-top:0">
  <div class="result-panel" id="resultPanel">
    <div class="result-score" id="resultScore">0</div>
    <div class="result-label">/ 100 分</div>
    <div class="result-breakdown" id="resultBreakdown"></div>
    <div class="result-message" id="resultMsg"></div>
    <div>
      <button class="btn-restart" onclick="restart()">&#x1F3B2;&nbsp;再抽 10 題</button>
    </div>
    <div class="pool-info">題庫共 30 題，每次隨機抽取 10 題</div>
  </div>
</div>

<div class="footer">AIEO 2026 &mdash; 陳昱傑醫師 課程教材</div>

<script>
const allQuestions = [
  {
    tag: "Google 商家經營",
    text: "在 Google 商家檔案的名稱欄位中，加上診所的主打療程關鍵字（例如「陳昱傑骨科診所｜PRP・超音波導引注射」），可以增加被搜尋到的機會。",
    answer: false,
    explain: "這是違反 Google 商家政策的行為！商家名稱只能使用真實世界的正式名稱，不能自行塞入療程或地名關鍵字。業界常把 2021 年的 Vicinity 更新與打擊名稱塞字連結，但重點不在演算法名稱：塞關鍵字本身就違反規範，可能被競爭對手檢舉、觸發演算法過濾與人工審查，導致檔案受限甚至停權，得不償失。"
  },
  {
    tag: "算力經濟學",
    text: "為了維持品牌視覺一致性，官網上的費用表應該統一使用設計師排版好的圖片格式，比工程師寫的純文字表格更專業。",
    answer: false,
    explain: "對 AI 來說，圖片就像一堵牆。讀取圖片中的文字需要啟動 OCR，算力成本遠高於直接讀取 HTML 純文字表格。設計師排版的圖片再精美，AI 讀不到裡面的價格資訊就沒有意義。在官網上，「資訊能被機器低成本讀取」的優先級永遠大於「排版華麗」。精美圖片留給 IG 就好。"
  },
  {
    tag: "Google Maps 影片",
    text: "同一支影片上傳到 Google Maps 時，應該分別放在「相片區」和「最新動態」兩個位置，因為兩者的曝光方式和功能不同。",
    answer: true,
    explain: "正確！這不是重複浪費，而是功能互補：相片區的影片會出現在商家首頁，自動靜音播放抓住注意力；最新動態的影片則可以搭配文案說明和動作按鈕（CTA），引導患者採取行動。兩邊都放，曝光和轉換兼顧。"
  },
  {
    tag: "網站更新策略",
    text: "定期將舊文章的發布日期更新為最新日期，可以讓 Google 認為網站持續在維護，有助於提升搜尋排名。",
    answer: false,
    explain: "這是「假性更新」，在課程中比喻為「偽造病歷」！只改日期、內容原封不動，無法帶來任何新價值，一旦被讀者或系統發現日期與內容對不上，反而削弱大家對你網站更新日期的信任。正確做法是每次更新都做「實質增修」：補上最新文獻 DOI 連結、新增臨床數據、更新治療案例等。"
  },
  {
    tag: "社群平台與 AI",
    text: "經營 Facebook 私密社團讓病患在裡面分享治療心得，是累積口碑、提升 AI 推薦的有效方法。",
    answer: false,
    explain: "Facebook 私密社團對 AI 來說是「上鎖的 VIP 病房」，AI 爬蟲根本進不去！只有公開平台上的內容（Google 評論、PTT、Dcard 等）AI 才爬得到。想讓病患口碑被 AI 看見，應該引導他們在 Google 商家留下公開評論，而不是把好評鎖在封閉社群裡。"
  },
  {
    tag: "YMYL 風險揭露",
    text: "在療程介紹頁面中，主動列出副作用發生率和禁忌症，AI 反而會認為這個網站更值得推薦。",
    answer: true,
    explain: "正確！醫療內容屬於 YMYL（Your Money or Your Life），AI 極度重視「安全性」。主動誠實揭露風險，AI 會判定你是客觀、負責任的醫療機構。2026 年的病患在找你之前早就問過 AI 了，如果你的網站避而不談風險，AI 反而認為你不夠客觀。"
  },
  {
    tag: "YouTube 字幕校正",
    text: "衛教影片上傳 YouTube 之後，系統自動產生的 CC 字幕已足以讓 AI 正確索引影片中提到的醫療術語。",
    answer: false,
    explain: "YouTube 自動辨識對醫療術語常常聽錯：把「PRP」聽成「People」、「骨刺」聽成「故事」、「玻尿酸」聽成「播音酸」。如果不校正，AI 就會用錯誤的字幕來索引你的影片。只需花 10 分鐘進後台校正關鍵字，就能換取整支影片的精準搜尋流量。"
  },
  {
    tag: "評論經營",
    text: "根據消費者行為研究，Google 評價 4.2 到 4.5 星的商家，消費者的購買意願反而比純 5.0 滿分更高。",
    answer: true,
    explain: "正確！公開的消費者行為研究觀察顯示，購買意願高峰約落在 4.2 到 4.5 星之間。接近完美的 5 星反而引發「太好了，是不是洗出來的？」的懷疑心理。與其追求純 5 星，不如及時、誠懇、客製化地回覆每一則負評——這是維繫關係與展現態度的基本功，不是操作 AI 排名的手段。"
  },
  {
    tag: "價格透明度",
    text: "當病患問 AI「PRP 治療多少錢」，如果你的官網只寫「歡迎來電洽詢」，AI 會跳過你的網站，改為推薦有標示費用區間的競爭對手。",
    answer: true,
    explain: "正確！AI 沒辦法打電話、沒辦法加 LINE、沒辦法掃 QR Code。「歡迎來電洽詢」對 AI 來說就是一道撞不過去的死牆，只好去推薦有明確標價的網站。正確做法是用 HTML 純文字表格公開費用區間，例如「PRP 單次注射費用約 15,000–18,000 元」。"
  },
  {
    tag: "影片品質管理",
    text: "用 LINE 傳送影片給同事再上傳到 Google 商家，跟用 AirDrop 或雲端硬碟傳送的畫質是一樣的。",
    answer: false,
    explain: "LINE 傳影片預設會壓縮，檔案大小大約只剩原來的三分之一，畫面會變得比較模糊，影響專業觀感。正確做法是從源頭就避開 LINE 壓縮：使用 AirDrop（iPhone）、Quick Share（Android）、雲端硬碟（Google Drive）或 USB 傳輸線，完整保留原始畫質。"
  },
  {
    tag: "爬蟲通行證",
    text: "llms.txt 的功能跟 robots.txt 相反：robots.txt 告訴爬蟲「哪裡不能去」，llms.txt 則是主動引導 AI「應該優先讀什麼」。",
    answer: true,
    explain: "正確！robots.txt 是被動防禦，告知爬蟲哪些區域禁止進入；llms.txt 則是 2024 年提出的新概念，用意是主動引導 AI 優先閱讀你的精華內容。但要注意：它目前仍是實驗性提案，Google 搜尋與 AI Mode 目前並不使用它，課程把它列為進階選做——網站本身清楚可讀的內容，永遠比這個檔案重要。"
  },
  {
    tag: "文章結構",
    text: "衛教文章的段落長度沒有特別限制，只要內容完整、邏輯通順，一個段落寫到上千字也沒有問題。",
    answer: false,
    explain: "AI 閱讀時會做「語意切片」，課程建議以每段 200–350 個中文字作為容易執行的起始值——這不是固定的排名門檻，語意完整仍然優先。但太長的段落主題容易發散、增加理解成本；就像把一大包藥分裝成一次吃一包的「餐包」才好消化，超過千字不分段的文字牆，對 AI 和讀者都是沉重負擔。"
  },
  {
    tag: "資訊增益",
    text: "如果你的衛教文章內容跟網路上已有的數百萬篇醫療文章大同小異，AI 不會因為你重新寫了一遍就額外加分。",
    answer: true,
    explain: "正確！重複已有的通用說法、沒有新增價值的內容，很難成為 AI 優先引用的來源。「多喝水有益健康」網路上已經有上百萬篇。AI 偏好高資訊增益的內容：獨家臨床觀察、第一手數據、對最新文獻的獨到解讀。只有你能寫出的內容，才有被優先引用的價值。"
  },
  {
    tag: "療效描述",

const QUIZ_SIZE = 10;
let currentQuiz = [];
let answered = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let unsureCount = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawQuiz() {
  currentQuiz = shuffle(allQuestions).slice(0, QUIZ_SIZE);
}

function renderQuestions() {
  const container = document.getElementById('qContainer');
  container.innerHTML = '';
  currentQuiz.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'q' + i;
    card.innerHTML =
      '<div class="q-header">' +
        '<div class="q-num">' + (i + 1) + '</div>' +
        '<div class="q-tag">' + q.tag + '</div>' +
      '</div>' +
      '<div class="q-text">' + q.text + '</div>' +
      '<div class="q-options">' +
        '<button class="q-btn" data-q="' + i + '" data-choice="true" onclick="pick(' + i + ', true, this)">&#x2714;&ensp;正確</button>' +
        '<button class="q-btn" data-q="' + i + '" data-choice="unsure" onclick="pick(' + i + ', \'unsure\', this)">&#x2753;&ensp;不確定</button>' +
        '<button class="q-btn" data-q="' + i + '" data-choice="false" onclick="pick(' + i + ', false, this)">&#x2718;&ensp;錯誤</button>' +
      '</div>' +
      '<div class="q-explain" id="explain' + i + '"></div>';
    container.appendChild(card);
  });
}

function pick(idx, choice, btn) {
  const q = currentQuiz[idx];
  const card = document.getElementById('q' + idx);
  const allBtns = card.querySelectorAll('.q-btn');
  if (card.dataset.answered) return;
  card.dataset.answered = '1';
  allBtns.forEach(function(b) { b.disabled = true; });

  var pts = 0, resultClass = '', ptsClass = '';

  if (choice === 'unsure') {
    pts = 5; unsureCount++;
    btn.classList.add('selected-unsure');
    card.classList.add('answered-unsure');
    resultClass = 'is-unsure'; ptsClass = 'u';
    allBtns.forEach(function(b) {
      var bc = b.dataset.choice;
      if ((q.answer && bc === 'true') || (!q.answer && bc === 'false')) b.classList.add('show-answer');
    });
  } else {
    var isCorrect = (choice === q.answer);
    if (isCorrect) {
      pts = 10; correctCount++;
      btn.classList.add('selected-correct');
      card.classList.add('answered-correct');
      resultClass = 'is-correct'; ptsClass = 'c';
    } else {
      pts = 0; wrongCount++;
      btn.classList.add('selected-wrong');
      card.classList.add('answered-wrong');
      resultClass = 'is-wrong'; ptsClass = 'w';
      allBtns.forEach(function(b) {
        var bc = b.dataset.choice;
        if ((q.answer && bc === 'true') || (!q.answer && bc === 'false')) b.classList.add('show-answer');
      });
    }
  }

  score += pts;
  answered++;

  var explDiv = document.getElementById('explain' + idx);
  var ptsText = pts === 10 ? '+10 分' : pts === 5 ? '+5 分' : '+0 分';
  var emoji = pts === 10 ? '&#x2705;' : pts === 5 ? '&#x1F914;' : '&#x274C;';
  var label = pts === 10 ? ' — 答對了！' : pts === 5 ? ' — 課程中將完整解答' : ' — 正確答案是「' + (q.answer ? '正確' : '錯誤') + '」';
  explDiv.innerHTML = '<div class="pts ' + ptsClass + '">' + emoji + ' ' + ptsText + label + '</div><div>' + q.explain + '</div>';
  explDiv.classList.add('visible', resultClass);

  updateProgress();
  if (answered === QUIZ_SIZE) setTimeout(showResult, 600);
}

function updateProgress() {
  document.getElementById('progFill').style.width = (answered / QUIZ_SIZE * 100) + '%';
  document.getElementById('progLabel').textContent = answered + ' / ' + QUIZ_SIZE;
}

function showResult() {
  var panel = document.getElementById('resultPanel');
  panel.classList.add('visible');
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultBreakdown').innerHTML =
    '<div class="result-stat"><div class="num c">' + correctCount + '</div><div class="lbl">答對</div></div>' +
    '<div class="result-stat"><div class="num u">' + unsureCount + '</div><div class="lbl">不確定</div></div>' +
    '<div class="result-stat"><div class="num w">' + wrongCount + '</div><div class="lbl">答錯</div></div>';

  var msg = '';
  if (score >= 80) msg = '您已經具備相當不錯的 AI 搜尋優化基礎觀念！課程將幫助您進一步掌握實戰細節與進階策略。';
  else if (score >= 50) msg = '您對部分概念已有正確直覺，但仍有一些關鍵知識需要在課程中補齊。這些「不確定」的題目，正是課程的核心價值所在。';
  else msg = '別擔心！這些題目涵蓋的都是 2026 年最新的 AI 搜尋趨勢，許多觀念顛覆了傳統行銷思維。課程結束後，您將完全掌握每一個概念。';
  document.getElementById('resultMsg').textContent = msg;
  panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function restart() {
  answered = 0; score = 0; correctCount = 0; wrongCount = 0; unsureCount = 0;
  document.getElementById('resultPanel').classList.remove('visible');
  drawQuiz();
  renderQuestions();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

drawQuiz();
renderQuestions();
updateProgress();
</script>
